<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Rove</title>
<style>
:root{
  --bg:#121820; --card:#1c2633; --line:#314056; --ink:#e8eef6; --dim:#8ea0b5;
  --gold:#e0c36a; --ok:#3ecf7a; --bad:#e07070; --btn:#4c6fff; --mine:#c4a06a;
  --fish:#6ab4d4; --fight:#d07070;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0f14;color:var(--ink);
  font:15px/1.35 system-ui,Segoe UI,sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;position:relative}
header{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--line);background:#151c26}
header b{letter-spacing:.12em}
.meta{font-size:12px;color:var(--dim)}
.gold{color:var(--gold);font-variant-numeric:tabular-nums}
main{flex:1;overflow:auto;padding:12px 12px 88px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
h2{margin:0 0 8px;font-size:15px}
.big{width:100%;border:0;border-radius:14px;padding:16px;font:600 16px system-ui;
  background:var(--btn);color:#fff;cursor:pointer}
.big:disabled{background:#2a3544;color:var(--dim)}
.timer{text-align:center;font-size:28px;font-variant-numeric:tabular-nums;margin:8px 0;color:var(--gold)}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #263140}
.row:last-child{border-bottom:0}
.dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:0 0 36px}
.grow{flex:1;min-width:0}
.sub{font-size:12px;color:var(--dim)}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.r-common{color:#c8d0d8}.r-uncommon{color:#7ec8a0}.r-rare{color:#7ec8c8}.r-chase{color:var(--gold)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:0;border-radius:8px;padding:8px 10px;background:#2a3544;color:var(--ink);font:inherit;cursor:pointer}
.btn.g{background:#2a4a34;color:var(--ok)}
.btn.o{background:#4a3a20;color:var(--gold)}
.btn.d{background:#4a2a2a;color:var(--bad)}
nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);
  background:#151c26;border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--dim);padding:8px 4px;font:12px system-ui;cursor:pointer}
nav button.on{color:var(--gold)}
.empty{color:var(--dim);text-align:center;padding:24px 8px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1c2633;
  border:1px solid var(--gold);color:var(--gold);padding:8px 12px;border-radius:10px;
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%}
.toast.on{opacity:1}
.slot{min-height:64px}
.hp{height:8px;background:#2a1818;border-radius:4px;overflow:hidden;margin-top:6px}
.hp>i{display:block;height:100%;background:var(--bad)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><b>ROVE</b><div class="meta">Lost on a strange planet</div><div class="meta" id="bagmeta">Bag 0/50</div></div>
    <div class="gold" id="gold">0 gp</div>
  </header>
  <main id="main"></main>
  <nav>
    <button class="on" data-v="hunt">Hunt</button>
    <button data-v="camp">Camp</button>
    <button data-v="bag">Bag</button>
    <button data-v="fight">Fight</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<script>
const HUNT_MS = 60 * 1000;
const BAG_MAX = 50;
const CAMPS = 4;
const XP_NEED = lv => 20 + lv * 12;

const SP = [
  {id:"gleck",n:"Ash Greeb",role:"mine",r:"common",evo:"gleckor",evoLv:10,mark:"▲",col:"#6e5a88"},
  {id:"gleckor",n:"Hulking Ash",role:"mine",r:"uncommon",mark:"◆",col:"#4a3868"},
  {id:"vorr",n:"Moss Greeb",role:"mine",r:"common",mark:"⬡",col:"#8a6048"},
  {id:"klyx",n:"Glass Greeb",role:"mine",r:"common",mark:"✧",col:"#70c8c0"},
  {id:"zoln",n:"Ember Greeb",role:"mine",r:"uncommon",mark:"◉",col:"#c45a32"},
  {id:"umberith",n:"Umber Greeb",role:"mine",r:"uncommon",mark:"▣",col:"#5a4838"},
  {id:"phaest",n:"Prime Digger",role:"mine",r:"rare",evo:"phaestyn",evoLv:16,mark:"✦",col:"#d4a060"},
  {id:"phaestyn",n:"Titan Digger",role:"mine",r:"rare",mark:"✸",col:"#e8c878"},
  {id:"quorvex",n:"Apex Digger",role:"mine",r:"chase",mark:"★",col:"#e0c36a"},
  {id:"nulith",n:"Tide Greeb",role:"fish",r:"common",evo:"nulithar",evoLv:10,mark:"☽",col:"#4a88b8"},
  {id:"nulithar",n:"Deep Tide",role:"fish",r:"uncommon",mark:"☾",col:"#2a6088"},
  {id:"iskari",n:"Drift Greeb",role:"fish",r:"common",mark:"◇",col:"#7ec8e0"},
  {id:"vesperid",n:"Veil Greeb",role:"fish",r:"common",mark:"✧",col:"#8a70b0"},
  {id:"thalune",n:"Murk Greeb",role:"fish",r:"uncommon",mark:"≈",col:"#3a7080"},
  {id:"orryx",n:"Keen Trawler",role:"fish",r:"uncommon",mark:"◈",col:"#50a090"},
  {id:"caelith",n:"Prime Trawler",role:"fish",r:"rare",mark:"▽",col:"#a8d0e8"},
  {id:"aelurion",n:"Apex Trawler",role:"fish",r:"chase",mark:"✧",col:"#d0e8f0"},
  {id:"draug",n:"Scrap Greeb",role:"fight",r:"common",evo:"draugoth",evoLv:10,mark:"✕",col:"#8a3048"},
  {id:"draugoth",n:"Hulking Scrap",role:"fight",r:"uncommon",mark:"⚔",col:"#6a1830"},
  {id:"velm",n:"Rust Greeb",role:"fight",r:"common",mark:"△",col:"#c07050"},
  {id:"skarnox",n:"Thorn Greeb",role:"fight",r:"common",mark:"▽",col:"#607848"},
  {id:"pyrrax",n:"Cinder Greeb",role:"fight",r:"uncommon",mark:"▲",col:"#d05028"},
  {id:"hokari",n:"Hollow Greeb",role:"fight",r:"uncommon",mark:"☰",col:"#4a5068"},
  {id:"nyxil",n:"Prime Scrapper",role:"fight",r:"rare",mark:"▼",col:"#3a2048"},
  {id:"myrrhax",n:"Apex Scrapper",role:"fight",r:"chase",mark:"♔",col:"#e0c36a"},
];
const W = {common:56, uncommon:28, rare:12, chase:4};
const CATCH = {common:0.9, uncommon:0.7, rare:0.4, chase:0.12};
const WILD = [
  {id:"shrike",n:"Rust drone",hp:16,atk:3,xp:8},
  {id:"wight",n:"Sentinel pylon",hp:32,atk:7,xp:18},
  {id:"hollow",n:"Patrol colossus",hp:58,atk:12,xp:32},
];

const sp = id => SP.find(s=>s.id===id);
function uid(){return Math.random().toString(36).slice(2,9)}
function rollSp(){
  const bag=[];
  for(const s of SP){ if(s.evo && SP.some(x=>x.evo===s.id)) continue; /* allow all including evos at low weight */
  }
  const pool=SP.filter(s=>!SP.some(x=>x.evo===s.id)); // only base forms in hunts
  const w=[];
  for(const s of pool){for(let i=0;i<(W[s.r]||1);i++) w.push(s)}
  return w[Math.floor(Math.random()*w.length)];
}

const S = {
  gold: 20,
  bag: [],
  camp: [null,null,null,null],
  huntAt: 0,
  view: "hunt",
  sel: null,
  fight: null,
  last: Date.now(),
  toast: "",
};
function save(){localStorage.setItem("rove-v2", JSON.stringify({...S, toast:"", fight:S.fight}))}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem("rove-v2")||"null");
    if(!d) return;
    S.gold=d.gold??20; S.bag=d.bag||[]; S.camp=d.camp||[null,null,null,null];
    S.huntAt=d.huntAt||0; S.last=d.last||Date.now();
    idle(Date.now()-S.last);
  }catch(e){}
}
function toast(m){S.toast=m; const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2400)}
function inCamp(id){return S.camp.includes(id)}
function cre(id){return S.bag.find(c=>c.u===id)}
function power(c){const s=sp(c.sp); const m=s.r==="chase"?8:s.r==="rare"?5:s.r==="uncommon"?3:2; return m+c.lv+(s.role==="fight"?2:0)}
function yieldAmt(c){return 1+Math.floor(c.lv/4)}
function idle(ms){
  const ticks=Math.min(400, Math.floor(ms/15000));
  if(ticks<1) return;
  for(let i=0;i<ticks;i++){
    for(const id of S.camp){
      if(!id) continue;
      const c=cre(id); if(!c) continue;
      const s=sp(c.sp);
      c.xp += 3;
      if(s.role==="mine") S.gold += yieldAmt(c);
      else if(s.role==="fish") S.gold += yieldAmt(c);
      else S.gold += yieldAmt(c)+1;
      while(c.xp>=XP_NEED(c.lv) && c.lv<40){c.xp-=XP_NEED(c.lv); c.lv++}
    }
  }
}

function huntReady(){return Date.now()>=S.huntAt}
function huntLeft(){return Math.max(0, S.huntAt-Date.now())}
function hunt(){
  if(!huntReady()) return;
  S.huntAt = Date.now()+HUNT_MS;
  if(Math.random()>0.8){toast("The explorer came back alone."); save(); render(); return}
  const s=rollSp();
  if(Math.random()>CATCH[s.r]){toast("A "+s.n+" watched you, then vanished."); save(); render(); return}
  if(S.bag.length>=BAG_MAX){toast("Bag full. Sell or graft first."); save(); render(); return}
  const c={u:uid(),sp:s.id,lv:1,xp:0};
  S.bag.push(c);
  toast("A "+s.n+" followed you home.");
  save(); render();
}

function sell(u){
  const c=cre(u); if(!c) return;
  if(inCamp(u)) S.camp=S.camp.map(x=>x===u?null:x);
  const s=sp(c.sp);
  const gp=(s.r==="chase"?80:s.r==="rare"?28:s.r==="uncommon"?10:4)*c.lv;
  S.gold+=gp;
  S.bag=S.bag.filter(x=>x.u!==u);
  if(S.sel===u) S.sel=null;
  toast("Sold "+s.n+" for "+gp+" gp");
  save(); render();
}
function combine(u){
  const c=cre(u); if(!c) return;
  const other=S.bag.find(x=>x.u!==u && x.sp===c.sp && !inCamp(x.u));
  if(!other){toast("Need another "+sp(c.sp).n+" in the bag, not in camp."); return}
  S.bag=S.bag.filter(x=>x.u!==other.u);
  c.xp += 40 + other.lv*15;
  while(c.xp>=XP_NEED(c.lv) && c.lv<40){c.xp-=XP_NEED(c.lv); c.lv++}
  const s=sp(c.sp);
  if(s.evo && c.lv>=s.evoLv){
    c.sp=s.evo; toast("Evolved into "+sp(c.sp).n);
  } else toast("Combined. "+sp(c.sp).n+" is lv "+c.lv);
  save(); render();
}
function assign(u, slot){
  if(inCamp(u)) S.camp=S.camp.map(x=>x===u?null:x);
  S.camp[slot]=u;
  save(); render();
}
function startFight(u, wildId){
  const c=cre(u); const w=WILD.find(x=>x.id===wildId);
  if(!c||!w) return;
  S.fight={u, wildId, chp: 10+power(c)*2, mhp:w.hp, mcur:w.hp, t:Date.now()};
  S.view="fight";
  render();
}
function fightTick(){
  const f=S.fight; if(!f) return;
  const c=cre(f.u); if(!c){S.fight=null; return}
  const w=WILD.find(x=>x.id===f.wildId);
  f.mcur -= Math.max(1, power(c));
  if(f.mcur<=0){
    c.xp += w.xp+8;
    while(c.xp>=XP_NEED(c.lv)&&c.lv<40){c.xp-=XP_NEED(c.lv);c.lv++}
    S.gold += 4+c.lv;
    S.fight=null;
    toast("Won. "+sp(c.sp).n+" gained xp.");
    save(); return;
  }
  f.chp -= Math.max(1, w.atk - Math.floor(c.lv/5));
  if(f.chp<=0){
    S.fight=null;
    toast(sp(c.sp).n+" fled the fight.");
    save();
  }
}

function fmt(ms){
  const s=Math.ceil(ms/1000); const m=Math.floor(s/60); const r=s%60;
  return m+":"+String(r).padStart(2,"0");
}
function sprite(s){
  return `<div class="dot" style="background:${s.col}">${s.mark}</div>`;
}
function roleLab(r){return r==="mine"?"Dig":r==="fish"?"Trawl":"Skirmish"}

function viewHunt(){
  const ready=huntReady();
  return `<div class="card">
    <h2>Explore</h2>
    <p class="sub">You are an explorer stranded on this planet. Send yourself out. Greebs — short, goblin-like, one species — may follow. Machines still patrol. 1:00 cooldown (test).</p>
    <div class="timer">${ready?"Ready":fmt(huntLeft())}</div>
    <button class="big" ${ready?"":"disabled"} onclick="hunt()">Walk the planet</button>
  </div>
  <div class="card"><h2>Greebs vs machines</h2>
    <p class="sub">Every Greeb is the same creature with a caste: Dig, Trawl, or Skirmish. Morphs are Ash, Tide, Scrap, and so on. Apex morphs usually vanish.</p>
    <p class="sub">Camp four of them. Fight the robots (drones, pylons, colossi). Graft two of the same morph to grow or evolve.</p>
  </div>`;
}
function viewCamp(){
  let h=`<div class="card"><h2>Camp · ${S.camp.filter(Boolean).length}/${CAMPS} working</h2>
    <p class="sub">Only four idle at once. Each tick (~15s) they earn gp and xp from their role.</p>`;
  for(let i=0;i<CAMPS;i++){
    const id=S.camp[i]; const c=id&&cre(id); const s=c&&sp(c.sp);
    h+=`<div class="row slot">${c?sprite(s)+`<div class="grow"><b>${s.n}</b> lv ${c.lv}<div class="sub">${roleLab(s.role)} · ${s.r}</div></div>
      <button class="btn" onclick="S.camp[${i}]=null;save();render()">Bench</button>`
      :`<div class="grow sub">Empty camp ${i+1}</div>`}</div>`;
  }
  h+=`</div><div class="card"><h2>Send from bag</h2>`;
  const free=S.bag.filter(c=>!inCamp(c.u));
  if(!free.length) h+=`<div class="empty">Catch something, then park it here.</div>`;
  else for(const c of free){
    const s=sp(c.sp);
    const slot=S.camp.findIndex(x=>!x);
    h+=`<div class="row">${sprite(s)}<div class="grow"><b>${s.n}</b> lv ${c.lv}<div class="sub">${roleLab(s.role)}</div></div>
      <button class="btn g" ${slot<0?"disabled":""} onclick="assign('${c.u}',${slot<0?0:slot})">Camp</button></div>`;
  }
  return h+`</div>`;
}
function viewBag(){
  let h=`<div class="card"><h2>Bag ${S.bag.length}/${BAG_MAX}</h2>
    <p class="sub">Sell for salvage. Graft two of the same morph for xp (and a hulking form if they have one).</p>`;
  if(!S.bag.length) h+=`<div class="empty">Empty. Hunt.</div>`;
  const sorted=[...S.bag].sort((a,b)=>sp(a.sp).n.localeCompare(sp(b.sp).n));
  for(const c of sorted){
    const s=sp(c.sp);
    const camp=inCamp(c.u);
    h+=`<div class="row">${sprite(s)}<div class="grow"><b>${s.n}</b> lv ${c.lv}
      <div class="sub"><span class="r-${s.r}">${s.r}</span> · ${roleLab(s.role)}${camp?" · camping":""}${s.evo?" · evo lv "+s.evoLv:""}</div></div></div>
      <div class="btns">
        <button class="btn o" onclick="combine('${c.u}')">Graft</button>
        <button class="btn d" onclick="sell('${c.u}')">Sell</button>
      </div>`;
  }
  return h+`</div>`;
}
function viewFight(){
  if(S.fight){
    const c=cre(S.fight.u); const s=c&&sp(c.sp); const w=WILD.find(x=>x.id===S.fight.wildId);
    return `<div class="card"><h2>Battle</h2>
      <div class="row">${c?sprite(s):""}<div class="grow"><b>${s?s.n:""}</b> HP ${Math.max(0,S.fight.chp)}<div class="hp"><i style="width:${Math.max(0,100*S.fight.chp/(10+power(c)*2))}%"></i></div></div></div>
      <div class="row"><div class="dot" style="background:#4a3040">◇</div><div class="grow"><b>${w.n}</b> HP ${Math.max(0,S.fight.mcur)}<div class="hp"><i style="width:${Math.max(0,100*S.fight.mcur/w.hp)}%"></i></div></div></div>
      <p class="sub">Auto-resolves. Camp still ticks.</p>
    </div>`;
  }
  const fighters=S.bag.filter(c=>sp(c.sp).role==="fight");
  let h=`<div class="card"><h2>Robot patrol</h2><p class="sub">Skirmish Greebs only. The planet’s machines do not join the bag.</p>`;
  if(!fighters.length) h+=`<div class="empty">Need a Skirmish Greeb (Scrap, Rust, Thorn…).</div>`;
  else {
    h+=`<p class="tag">Your Greeb</p>`;
    for(const c of fighters){
      const s=sp(c.sp);
      h+=`<div class="row">${sprite(s)}<div class="grow"><b>${s.n}</b> lv ${c.lv} · pwr ${power(c)}</div>
        <button class="btn g" onclick="startFight('${c.u}','shrike')">Drone</button>
        <button class="btn" onclick="startFight('${c.u}','wight')">Pylon</button>
        <button class="btn o" onclick="startFight('${c.u}','hollow')">Colossus</button></div>`;
    }
  }
  return h+`</div>`;
}

function render(){
  document.getElementById("bagmeta").textContent="Bag "+S.bag.length+"/"+BAG_MAX;
  document.getElementById("gold").textContent=S.gold+" scrap";
  const v=S.view;
  document.getElementById("main").innerHTML =
    v==="hunt"?viewHunt():v==="camp"?viewCamp():v==="bag"?viewBag():viewFight();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v; render()});

load();
render();
let acc=0;
setInterval(()=>{
  if(S.fight) fightTick();
  acc+=1000;
  if(acc>=15000){ idle(15000); acc=0; }
  S.last=Date.now();
  save();
  render();
},1000);
</script>
</body>
</html>
