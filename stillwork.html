<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Stillwork — Combat</title>
<style>
:root{
  --bg:#1b2330; --rail:#151b26; --panel:#243044; --card:#2b3a52;
  --line:#3a4b63; --ink:#dce6f2; --dim:#8fa0b5; --gold:#e0c36a;
  --hp:#3ecf7a; --mhp:#e07070; --btn:#4c6fff; --btn2:#d48a3a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f141c;color:var(--ink);font:13px/1.35 system-ui,Segoe UI,sans-serif}
#shell{display:grid;grid-template-columns:210px 1fr;height:100%}
.rail{background:var(--rail);overflow:auto;padding:10px 0;border-right:1px solid #0b0f14}
.logo{padding:8px 14px 14px;font-weight:700;letter-spacing:.12em;color:#f2d48a}
.logo small{display:block;color:var(--dim);font-weight:500;letter-spacing:0;margin-top:2px}
.sec{padding:10px 14px 4px;color:#6e7f94;font-size:10px;letter-spacing:.08em}
.item{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;cursor:pointer;color:var(--ink)}
.item:hover,.item.on{background:#1e2736}
.item.lock{color:#6a7788}
.item .lv{color:var(--dim);font-variant-numeric:tabular-nums}
.hpnum{color:#3ecf7a}
.top{background:#2a3344;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid #1a2230}
.top h1{margin:0;font-size:16px;font-weight:600}
.top .r{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:12px}
.btn{border:0;border-radius:4px;padding:6px 10px;cursor:pointer;color:#fff;font:inherit}
.btn.g{background:#3d8b5a}
.btn.b{background:var(--btn)}
.btn.o{background:var(--btn2)}
.wrap{background:linear-gradient(#1e2a3c,#1b2330);padding:12px 16px 20px;height:calc(100% - 46px);overflow:auto}
.banner{background:#243044;border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:10px;color:var(--dim)}
.tabs{display:flex;justify-content:center;gap:28px;padding:10px 0 16px;color:var(--dim)}
.tabs span{cursor:pointer}
.tabs .on{color:var(--ink);border-bottom:2px solid #7aa0ff;padding-bottom:4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:640px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.hbar{height:14px;background:#1a2230;border-radius:2px;overflow:hidden}
.hbar>i{display:block;height:100%;background:var(--hp)}
.mbar>i{background:var(--mhp);width:0}
.row2{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.heart{color:#e07070}
.card{background:var(--card);border-radius:8px;padding:10px}
.card h3{margin:0 0 8px;text-align:center;font-size:13px;font-weight:600}
.food{display:flex;gap:8px;align-items:center;justify-content:center}
.food select{background:#1a2230;color:var(--ink);border:1px solid var(--line);padding:6px;border-radius:4px}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:40px;height:40px;border-radius:6px;background:#1a2230;border:2px solid #3a4b63;display:grid;place-items:center;font-size:16px}
.slot.eq{border-color:#3ecf7a}
.eqgrid{display:grid;grid-template-columns:repeat(3,48px);gap:8px;justify-content:center}
.stats{width:100%;border-collapse:collapse;font-size:12px}
.stats td{padding:3px 0;color:var(--dim)}
.stats td:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.monster{flex:1;background:#1a2230;border-radius:6px;min-height:160px;display:grid;place-items:center;color:var(--dim)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:9}
.modal.on{display:grid}
.sheet{background:#243044;border:1px solid var(--line);border-radius:10px;padding:16px;width:min(520px,92vw)}
.mob{display:flex;justify-content:space-between;padding:8px;border:1px solid var(--line);border-radius:6px;margin:6px 0;cursor:pointer;background:#1a2230}
.mob:hover{border-color:var(--gold)}
</style>
</head>
<body>
<div id="shell">
  <aside class="rail">
    <div class="logo">STILLWORK<small>idle skills · original spike</small></div>
    <div class="item" data-tab="shop"><span>Shop</span><span class="lv">0 gp</span></div>
    <div class="item on" data-tab="bank"><span>Bank</span><span class="lv" id="bankn">0</span></div>
    <div class="sec">COMBAT</div>
    <div class="item on" data-tab="combat"><span>Combat</span><span class="lv" id="clv"></span></div>
    <div class="item" data-tab="attack"><span>Attack</span><span class="lv" id="alv"></span></div>
    <div class="item" data-tab="strength"><span>Strength</span><span class="lv" id="slv"></span></div>
    <div class="item" data-tab="defence"><span>Defence</span><span class="lv" id="dlv"></span></div>
    <div class="item" data-tab="hitpoints"><span>Hitpoints</span><span class="lv hpnum" id="hlv"></span></div>
    <div class="item lock"><span>Ranged</span><span class="lv">locked</span></div>
    <div class="item lock"><span>Prayer</span><span class="lv">locked</span></div>
    <div class="sec">GATHER</div>
    <div class="item" data-tab="quarry"><span>Quarry</span><span class="lv" id="qlv"></span></div>
    <div class="item" data-tab="forest"><span>Forest</span><span class="lv" id="flv"></span></div>
    <div class="item" data-tab="river"><span>River</span><span class="lv" id="rlv"></span></div>
    <div class="sec">CRAFT</div>
    <div class="item" data-tab="smith"><span>Smith</span><span class="lv" id="mlv"></span></div>
    <div class="item" data-tab="kitchen"><span>Kitchen</span><span class="lv" id="klv"></span></div>
    <div class="sec">PASSIVE</div>
    <div class="item lock"><span>Farming</span><span class="lv">locked</span></div>
    <div class="item lock"><span>Township</span><span class="lv">locked</span></div>
  </aside>
  <div>
    <div class="top">
      <h1 id="pagetitle">Combat</h1>
      <div class="r"><span id="saved">Local save</span><button class="btn g" onclick="save(true)">Force Save</button></div>
    </div>
    <div class="wrap" id="main"></div>
  </div>
</div>
<div class="modal" id="areas">
  <div class="sheet">
    <h2 style="margin:0 0 8px">Combat areas</h2>
    <p style="color:var(--dim);margin:0 0 8px">Pick a fight. Original creatures, not Melvor’s.</p>
    <div id="arealist"></div>
    <button class="btn" style="background:#334" onclick="areas.classList.remove('on')">Close</button>
  </div>
</div>
<script>
const XP=n=>Math.floor(n*n*10+50);
function lv(xp){let l=1,s=0;while(l<99){const n=XP(l);if(xp<s+n)return l;s+=n;l++}return 99}
function into(xp){let l=1,s=0;while(l<99){const n=XP(l);if(xp<s+n)return{l,into:xp-s,need:n};s+=n;l++}return{l:99,into:1,need:1}}
const ITEMS={
  copper:{n:"Copper ore"},iron:{n:"Iron ore"},coal:{n:"Coal"},log:{n:"Oak log"},
  cbar:{n:"Copper bar"},ibar:{n:"Iron bar"},fish:{n:"Trout"},stew:{n:"Camp stew"},
  csword:{n:"Copper blade"},isword:{n:"Iron blade"},hide:{n:"Wolf hide"},fang:{n:"Dire fang"},
  helm:{n:"Copper helm"},body:{n:"Copper mail"}
};
const ACT={
  quarry:[
    {id:"copper",name:"Copper vein",sk:"quarry",ms:1800,xp:8,lvl:1,out:{copper:1}},
    {id:"coal",name:"Coal seam",sk:"quarry",ms:2400,xp:14,lvl:10,out:{coal:1}},
    {id:"iron",name:"Iron vein",sk:"quarry",ms:3200,xp:22,lvl:20,out:{iron:1}},
  ],
  forest:[{id:"log",name:"Oak",sk:"forest",ms:2000,xp:10,lvl:1,out:{log:1}}],
  river:[{id:"fish",name:"Trout pool",sk:"river",ms:2600,xp:12,lvl:1,out:{fish:1}}],
  smith:[
    {id:"cbar",name:"Copper bar",sk:"smith",ms:2200,xp:12,lvl:1,inn:{copper:1,coal:1},out:{cbar:1}},
    {id:"ibar",name:"Iron bar",sk:"smith",ms:3000,xp:20,lvl:20,inn:{iron:1,coal:1},out:{ibar:1}},
    {id:"csword",name:"Copper blade",sk:"smith",ms:4000,xp:28,lvl:5,inn:{cbar:2},out:{csword:1}},
    {id:"isword",name:"Iron blade",sk:"smith",ms:5200,xp:40,lvl:25,inn:{ibar:2},out:{isword:1}},
    {id:"helm",name:"Copper helm",sk:"smith",ms:3600,xp:24,lvl:8,inn:{cbar:1},out:{helm:1}},
    {id:"body",name:"Copper mail",sk:"smith",ms:4800,xp:32,lvl:12,inn:{cbar:3},out:{body:1}},
  ],
  kitchen:[{id:"stew",name:"Camp stew",sk:"kitchen",ms:2800,xp:16,lvl:1,inn:{fish:1,log:1},out:{stew:1}}],
};
const MOBS=[
  {id:"rat",name:"Trail rat",hp:20,atk:3,def:0,ms:2400,xp:12,lvl:1,drops:[{id:"hide",p:.2,n:1}]},
  {id:"wolf",name:"Grey wolf",hp:42,atk:7,def:2,ms:2600,xp:28,lvl:10,drops:[{id:"hide",p:.6,n:1},{id:"fang",p:.1,n:1}]},
  {id:"dire",name:"Dire wolf",hp:80,atk:12,def:4,ms:2800,xp:48,lvl:25,drops:[{id:"hide",p:.75,n:2},{id:"fang",p:.3,n:1}]},
];
const S={
  xp:{combat:0,attack:0,strength:0,defence:0,hitpoints:400,quarry:0,forest:0,river:0,smith:0,kitchen:0},
  bank:{copper:6,coal:3,log:4,fish:3,stew:2},
  hp:40,maxHp:40,food:"stew",auto:true,
  action:null,combat:null,tab:"combat",saved:Date.now(),log:[]
};
const q=id=>S.bank[id]|0;
const add=(id,n)=>{S.bank[id]=q(id)+n};
function take(inn){if(!inn)return true;for(const[k,v]of Object.entries(inn))if(q(k)<v)return false;for(const[k,v]of Object.entries(inn))S.bank[k]-=v;return true}
function load(){try{const d=JSON.parse(localStorage.getItem("stillwork-v2")||"null");if(!d)return;Object.assign(S.xp,d.xp||{});Object.assign(S.bank,d.bank||{});S.hp=d.hp??40;S.maxHp=d.maxHp??40;S.food=d.food||"stew";S.auto=d.auto!==false;S.action=d.action;S.combat=d.combat;S.tab=d.tab||"combat";const el=Math.min(8*3600e3,Date.now()-(d.saved||Date.now()));if(el>2000)offline(el)}catch(e){}}
function save(force){S.saved=Date.now();localStorage.setItem("stillwork-v2",JSON.stringify({xp:S.xp,bank:S.bank,hp:S.hp,maxHp:S.maxHp,food:S.food,auto:S.auto,action:S.action,combat:S.combat,tab:S.tab,saved:S.saved}));if(force)note("Saved locally")}
function note(m){S.log.unshift(m);S.log=S.log.slice(0,30)}
function wpn(){if(q("isword"))return{atk:11,str:9,name:"Iron blade"};if(q("csword"))return{atk:6,str:5,name:"Copper blade"};return{atk:1,str:1,name:"Fist"}}
function defn(){let d=0;if(q("helm"))d+=2;if(q("body"))d+=4;return d}
function eat(){const heal=S.food==="stew"?18:8;if(q(S.food)<1){if(S.auto){if(q("stew"))S.food="stew";else if(q("fish"))S.food="fish";else return false}else return false}if(q(S.food)<1)return false;add(S.food,-1);S.hp=Math.min(S.maxHp,S.hp+heal);return true}
function can(a){if(lv(S.xp[a.sk])<a.lvl)return false;if(a.inn)for(const[k,v]of Object.entries(a.inn))if(q(k)<v)return false;return true}
function doSkill(a){if(!can(a)){S.action=null;return}if(a.inn&&!take(a.inn)){S.action=null;return}for(const[k,v]of Object.entries(a.out))add(k,v);S.xp[a.sk]+=a.xp}
function hit(){const m=MOBS.find(x=>x.id===S.combat.mobId);if(!m){S.combat=null;return}
  const W=wpn();const dmg=Math.max(1,Math.floor((W.str+lv(S.xp.strength))/2)-m.def);
  S.combat.hp-=dmg;S.xp.attack+=2;S.xp.strength+=2;S.xp.combat+=3;
  if(S.combat.hp<=0){S.xp.combat+=m.xp;S.xp.hitpoints+=4;S.maxHp=40+lv(S.xp.hitpoints)-1;for(const d of m.drops)if(Math.random()<d.p){add(d.id,d.n);note(m.name+" dropped "+ITEMS[d.id].n)}note("Defeated "+m.name);S.combat.hp=m.hp}
  else{const tk=Math.max(1,m.atk-Math.floor(defn()/2));S.hp-=tk;if(S.hp<=S.maxHp*0.5)eat();if(S.hp<=0){S.hp=Math.floor(S.maxHp*0.35);S.combat=null;S.action=null;note("You fled. Cook stew.")}}
}
function actMs(){if(!S.action)return 2e3;if(S.action.sk==="road"){const m=MOBS.find(x=>x.id===S.combat?.mobId);return m?m.ms:2400}const a=findA();return a?a.ms:2e3}
function findA(){return (ACT[S.action?.sk]||[]).find(a=>a.id===S.action.id)}
function tick(){if(!S.action)return;if(S.action.sk==="road")hit();else{const a=findA();if(!a){S.action=null;return}doSkill(a)}}
function offline(ms){let n=0;while(ms>0&&S.action&&n<8000){const s=actMs();if(ms<s)break;tick();if(!S.action)break;ms-=s;n++}if(n)note("Away: "+n+" actions")}
function startA(sk,id){const a=(ACT[sk]||[]).find(x=>x.id===id);if(!a||!can(a))return;S.combat=null;S.action={sk,id,t:Date.now()};note("Working "+a.name)}
function startF(id){const m=MOBS.find(x=>x.id===id);if(!m||lv(S.xp.combat)<m.lvl)return;S.action={sk:"road",id,t:Date.now()};S.combat={mobId:id,hp:m.hp};S.tab="combat";areas.classList.remove("on");note("Fighting "+m.name)}
function railLv(){
  const map={clv:["combat"],alv:["attack"],slv:["strength"],dlv:["defence"],hlv:["hitpoints"],qlv:["quarry"],flv:["forest"],rlv:["river"],mlv:["smith"],klv:["kitchen"]};
  for(const[id,k]of Object.entries(map)){const e=document.getElementById(id);if(e)e.textContent=lv(S.xp[k[0]])}
  document.getElementById("bankn").textContent=Object.values(S.bank).reduce((a,b)=>a+(b>0?1:0),0);
  document.getElementById("hlv").textContent=S.hp;
}
function combatView(){
  const W=wpn();const m=S.combat?MOBS.find(x=>x.id===S.combat.mobId):null;
  const minHit=1,maxHit=Math.max(1,Math.floor((W.str+lv(S.xp.strength))/2));
  const acc=400+W.atk*40+lv(S.xp.attack)*8;
  const eva=200+defn()*30+lv(S.xp.defence)*6;
  const hpPct=100*S.hp/S.maxHp;
  const mPct=m?100*S.combat.hp/m.hp:0;
  return `<div class="banner">Toggle skill progress — Stillwork spike, Melvor-shaped layout, original content.</div>
  <div class="tabs"><span class="on">Combat Areas</span><span>Slayer Areas</span><span>Dungeons</span><span>Strongholds</span></div>
  <div class="cols">
    <div class="box">
      <div class="hbar"><i style="width:${hpPct}%"></i></div>
      <div class="row2"><div><span class="heart">HP</span> <b>${S.hp}</b> / ${S.maxHp}</div><div>Attack interval: ${m?(m.ms/1000).toFixed(2):"4.00"}s</div></div>
      <div class="card"><h3>Food</h3>
        <div class="food">
          <select id="foodsel">
            <option value="stew" ${S.food==="stew"?"selected":""}>(${q("stew")}) Camp stew +18 HP</option>
            <option value="fish" ${S.food==="fish"?"selected":""}>(${q("fish")}) Trout +8 HP</option>
          </select>
        </div>
        <label style="display:block;margin-top:8px;color:var(--dim);font-size:12px"><input type="checkbox" id="auto" ${S.auto?"checked":""}> Automatically swap food when it runs out</label>
      </div>
      <div class="card"><h3>Menu</h3><div class="slots">
        <div class="slot">🪓</div><div class="slot">📜</div><div class="slot">⚙️</div>
        <div class="slot">✨</div><div class="slot">🐺</div><div class="slot">🔴</div>
      </div></div>
      <div class="card"><h3>Equipment</h3>
        <div class="eqgrid">
          <div class="slot ${q("helm")?"eq":""}" title="Helm">${q("helm")?"⛑":""}</div>
          <div class="slot"></div><div class="slot"></div>
          <div class="slot ${W.name!=="Fist"?"eq":""}" title="${W.name}">${W.name==="Fist"?"":"⚔"}</div>
          <div class="slot ${q("body")?"eq":""}" title="Body">${q("body")?"🛡":""}</div>
          <div class="slot"></div>
          <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        </div>
        <div style="text-align:center;margin-top:6px;color:#7aa0ff;cursor:pointer">View equipment stats</div>
      </div>
      <div class="card"><h3>Stats</h3>
        <table class="stats">
          <tr><td>Damage type</td><td>Normal</td></tr>
          <tr><td>Minimum hit</td><td>${minHit}</td></tr>
          <tr><td>Maximum hit</td><td>${maxHit}</td></tr>
          <tr><td>Accuracy rating</td><td>${acc}</td></tr>
          <tr><td>Crit chance</td><td>0%</td></tr>
          <tr><td>Evasion</td><td>${eva}</td></tr>
          <tr><td>Damage reduction</td><td>${defn()}%</td></tr>
        </table>
      </div>
    </div>
    <div class="box">
      <div class="hbar mbar"><i style="width:${mPct}%"></i></div>
      <div class="row2"><div><span class="heart">HP</span> ${m?S.combat.hp+" / "+m.hp:"- / -"}</div><div>Attack interval: ${m?(m.ms/1000).toFixed(2)+'s':"-"}</div></div>
      <div class="monster">${m?`<div style="text-align:center"><div style="font-size:42px">🐺</div><div style="color:var(--ink);font-size:16px">${m.name}</div></div>`:"No monster selected"}</div>
      <div class="actions"><button class="btn b" onclick="alert((S.combat?MOBS.find(x=>x.id===S.combat.mobId).drops.map(d=>ITEMS[d.id].n+' '+Math.round(d.p*100)+'%').join('\\n'):'Select a monster first'))">View monster drops</button>
      <button class="btn o" onclick="areas.classList.add('on')">Run / Area select</button></div>
      <div class="sub2">
        <div class="card"><h3>Offensive stats</h3>
          <table class="stats"><tr><td>Attack type</td><td>${W.name}</td></tr>
          <tr><td>Min hit</td><td>${minHit}</td></tr><tr><td>Max hit</td><td>${maxHit}</td></tr></table></div>
        <div class="card"><h3>Defensive stats</h3>
          <table class="stats"><tr><td>Evasion</td><td>${eva}</td></tr><tr><td>DR</td><td>${defn()}%</td></tr></table></div>
      </div>
    </div>
  </div>`;
}
function skillView(sk,title){
  const st=into(S.xp[sk]||0);
  let h=`<div class="banner">${title} · level ${st.l} · ${st.into} / ${st.need} xp</div><div class="hbar"><i style="width:${100*st.into/st.need}%"></i></div>`;
  for(const a of ACT[sk]||[]){
    const lock=lv(S.xp[sk])<a.lvl;
    const on=S.action&&S.action.sk===sk&&S.action.id===a.id;
    const need=a.inn?Object.entries(a.inn).map(([k,v])=>v+" "+ITEMS[k].n).join(" + "):"no input";
    h+=`<div class="mob" style="${on?"border-color:var(--gold)":""}" onclick="startA('${sk}','${a.id}')"><span>${lock?"Locked · ":""}${a.name}<br><small style="color:var(--dim)">${need} → ${Object.values(a.out)[0]} ${ITEMS[Object.keys(a.out)[0]].n}</small></span><span>${(a.ms/1000).toFixed(1)}s</span></div>`;
  }
  return h;
}
function bankView(){
  const keys=Object.keys(ITEMS).filter(k=>q(k)>0);
  return `<div class="banner">Bank — ${keys.length} slots used</div>`+keys.map(k=>`<div class="mob"><span>${ITEMS[k].n}</span><b>${q(k)}</b></div>`).join("")+(S.log.length?`<div class="card" style="margin-top:12px">${S.log.map(x=>`<div>${x}</div>`).join("")}</div>`:"");
}
function shopView(){return `<div class="banner">No cash shop. Gear comes from smithing and drops.</div>`}
function render(){
  railLv();
  const titles={combat:"Combat",attack:"Attack",strength:"Strength",defence:"Defence",hitpoints:"Hitpoints",bank:"Bank",shop:"Shop",quarry:"Quarry",forest:"Forest",river:"River",smith:"Smith",kitchen:"Kitchen"};
  document.getElementById("pagetitle").textContent=titles[S.tab]||S.tab;
  let html="";
  if(S.tab==="combat"||S.tab==="attack"||S.tab==="strength"||S.tab==="defence"||S.tab==="hitpoints")html=combatView();
  else if(S.tab==="bank")html=bankView();
  else if(S.tab==="shop")html=shopView();
  else html=skillView(S.tab,titles[S.tab]);
  document.getElementById("main").innerHTML=html;
  const fs=document.getElementById("foodsel"); if(fs) fs.onchange=e=>S.food=e.target.value;
  const au=document.getElementById("auto"); if(au) au.onchange=e=>S.auto=e.target.checked;
  document.getElementById("arealist").innerHTML=MOBS.map(m=>`<div class="mob" onclick="startF('${m.id}')"><span>${m.name}</span><span>Lv ${m.lvl} · ${m.hp} hp</span></div>`).join("");
}
document.querySelectorAll(".item[data-tab]").forEach(el=>el.onclick=()=>{
  document.querySelectorAll(".item").forEach(x=>x.classList.remove("on"));
  el.classList.add("on"); S.tab=el.dataset.tab; render();
});
load();
let last=Date.now(), dirty=true, lastUi=0;
function loop(){
  const now=Date.now();
  if(S.action){const ms=actMs();while(now-S.action.t>=ms){S.action.t+=ms;tick();dirty=true;if(!S.action)break}}
  if(now-last>1200){save();last=now;const s=document.getElementById("saved"); if(s) s.textContent="Saved "+new Date().toLocaleTimeString()}
  if(dirty && now-lastUi>200){render();dirty=false;lastUi=now}
  requestAnimationFrame(loop);
}
render();
requestAnimationFrame(loop);
</script>
</body>
</html>
